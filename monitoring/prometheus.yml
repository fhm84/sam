global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: sam
    metrics_path: /q/metrics
    static_configs:
      # Port 9000 = quarkus.management.port, pinned in
      # server/src/main/resources/application.properties. Keep in sync with
      # docker/nginx.conf if that value ever changes.
      - targets:
          - host.docker.internal:9000
