name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  commit-lint:
    name: Commit Message Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate commit messages
        run: |
          git log --format=%s origin/${{ github.base_ref }}..HEAD | while IFS= read -r subject; do
            echo "$subject" | ./scripts/check-commit-msg.sh
          done

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Check formatting
        run: ./mvnw spotless:check

      - name: Run unit tests
        run: ./mvnw test

      - name: Publish JUnit test results
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: '**/target/surefire-reports/*.xml'

  ui-test:
    name: UI Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: ui/src/main/webui/package-lock.json

      - name: Install dependencies
        working-directory: ui/src/main/webui
        run: npm ci

      - name: Run UI unit tests
        working-directory: ui/src/main/webui
        run: npm test