<p-toast />
<div class="app-layout">
  <!-- Topbar -->
  <header class="app-topbar">
    <div class="topbar-start">
      <button class="topbar-btn desktop-only" (click)="toggleSidebar()" [attr.aria-label]="'aria.toggleSidebar' | translate">
        <i class="pi" [class.pi-chevron-left]="!sidebarCollapsed()" [class.pi-chevron-right]="sidebarCollapsed()"></i>
      </button>
      <button class="topbar-btn mobile-only" (click)="openDrawer()" [attr.aria-label]="'aria.openMenu' | translate">
        <i class="pi pi-bars"></i>
      </button>
      <span class="app-logo">
        <span class="app-logo-img" role="img" [attr.aria-label]="'aria.samLogo' | translate"></span>
        <span class="app-title">{{ 'app.title' | translate }}</span>
      </span>
    </div>
    <div class="topbar-end">
      <button class="topbar-btn lang-toggle" (click)="i18n.toggleLocale()" [attr.aria-label]="'aria.switchLanguage' | translate">
        <span class="lang-label">{{ i18n.localeLabel() }}</span>
      </button>
      <button class="topbar-btn theme-toggle" (click)="theme.toggle()" [attr.aria-label]="(theme.dark() ? 'aria.switchToLight' : 'aria.switchToDark') | translate">
        <i [class]="darkIcon()"></i>
      </button>
    </div>
  </header>

  <div class="app-body">
    <app-sidebar [collapsed]="sidebarCollapsed()" [(drawerVisible)]="drawerVisible" />

    <!-- Main content -->
    <main class="app-content">
      <router-outlet />
    </main>
  </div>
</div>
