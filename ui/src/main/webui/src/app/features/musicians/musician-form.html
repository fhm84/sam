<form [formGroup]="form" (ngSubmit)="onSave()" class="flex flex-col gap-5 pt-4">

  <!-- Name -->
  <div class="flex flex-col gap-1.5">
    <div class="grid items-center gap-2 [grid-template-columns:1fr_2rem]">
      <p-floatlabel variant="on" class="block">
        <input pInputText id="musician-name" formControlName="name" class="w-full" />
        <label for="musician-name">{{ 'musicians.form.name' | translate }}</label>
      </p-floatlabel>
    </div>
  </div>

  <!-- IPI -->
  <div class="flex flex-col gap-1.5">
    <div class="grid items-center gap-2 [grid-template-columns:1fr_2rem]">
      <p-floatlabel variant="on" class="block">
        <input pInputText id="musician-ipi" formControlName="ipi" class="w-full" [placeholder]="t.t('musicians.form.ipiHint')" />
        <label for="musician-ipi">{{ 'musicians.form.ipi' | translate }}</label>
      </p-floatlabel>
      <i
        class="pi pi-info-circle justify-self-center text-sm text-[var(--sam-text-muted)] cursor-help transition-colors hover:text-[var(--sam-text-secondary)]"
        [pTooltip]="t.t('musicians.form.ipiTooltip')"
        tooltipPosition="right"
      ></i>
    </div>
  </div>

  <!-- Birth Year / Death Year -->
  <div class="flex gap-4">
    <div class="flex flex-col gap-1.5 flex-1 min-w-0">
      <div class="grid items-center gap-2 [grid-template-columns:1fr_2rem]">
        <p-floatlabel variant="on" class="block">
          <p-inputnumber
            inputId="musician-birthYear"
            formControlName="birthYear"
            [useGrouping]="false"
            [maxFractionDigits]="0"
            styleClass="w-full"
            inputStyleClass="w-full"
          />
          <label for="musician-birthYear">{{ 'musicians.form.birthYear' | translate }}</label>
        </p-floatlabel>
      </div>
    </div>

    <div class="flex flex-col gap-1.5 flex-1 min-w-0">
      <div class="grid items-center gap-2 [grid-template-columns:1fr_2rem]">
        <p-floatlabel variant="on" class="block">
          <p-inputnumber
            inputId="musician-deathYear"
            formControlName="deathYear"
            [useGrouping]="false"
            [maxFractionDigits]="0"
            styleClass="w-full"
            inputStyleClass="w-full"
          />
          <label for="musician-deathYear">{{ 'musicians.form.deathYear' | translate }}</label>
        </p-floatlabel>
      </div>
    </div>
  </div>

  <div class="flex justify-end gap-2 pt-2">
    <p-button
      [label]="t.t('musicians.cancel')"
      severity="secondary"
      [text]="true"
      (onClick)="cancelled.emit()"
    />
    <p-button
      [label]="t.t('musicians.save')"
      type="submit"
      [disabled]="form.invalid || saving"
      [loading]="saving"
    />
  </div>
</form>
