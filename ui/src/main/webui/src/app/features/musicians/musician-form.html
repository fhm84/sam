<form [formGroup]="form" (ngSubmit)="onSave()" class="sam-form">
  <div class="form-field">
    <p-floatlabel variant="on">
      <input pInputText id="musician-name" formControlName="name" />
      <label for="musician-name">{{ 'musicians.form.name' | translate }}</label>
    </p-floatlabel>
  </div>

  <div class="form-field">
    <div class="field-with-hint">
      <p-floatlabel variant="on">
        <input pInputText id="musician-ipi" formControlName="ipi" [placeholder]="t.t('musicians.form.ipiHint')" />
        <label for="musician-ipi">{{ 'musicians.form.ipi' | translate }}</label>
      </p-floatlabel>
      <i class="pi pi-info-circle field-hint-icon"
         [pTooltip]="t.t('musicians.form.ipiTooltip')"
         tooltipPosition="right"></i>
    </div>
  </div>

  <div class="form-row">
    <div class="form-field">
      <p-floatlabel variant="on">
        <p-inputnumber
          inputId="musician-birthYear"
          formControlName="birthYear"
          [useGrouping]="false"
          [maxFractionDigits]="0"
          styleClass="w-full"
        />
        <label for="musician-birthYear">{{ 'musicians.form.birthYear' | translate }}</label>
      </p-floatlabel>
    </div>

    <div class="form-field">
      <p-floatlabel variant="on">
        <p-inputnumber
          inputId="musician-deathYear"
          formControlName="deathYear"
          [useGrouping]="false"
          [maxFractionDigits]="0"
          styleClass="w-full"
        />
        <label for="musician-deathYear">{{ 'musicians.form.deathYear' | translate }}</label>
      </p-floatlabel>
    </div>
  </div>

  <div class="form-actions">
    <p-button
      [label]="t.t('musicians.cancel')"
      severity="secondary"
      [text]="true"
      (onClick)="cancelled.emit()"
    />
    <p-button
      [label]="t.t('musicians.save')"
      type="submit"
      [disabled]="form.invalid || saving"
      [loading]="saving"
    />
  </div>
</form>
