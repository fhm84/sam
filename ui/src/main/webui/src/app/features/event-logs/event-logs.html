<div class="flex flex-col gap-4">
  <p-toolbar>
    <ng-template #start>
      <div class="flex flex-col gap-0.5">
        <h1 class="m-0 text-2xl font-semibold text-[var(--sam-text)]">{{ 'eventLogs.title' | translate }}</h1>
        <p class="m-0 text-sm text-[var(--sam-text-muted)]">{{ 'eventLogs.subtitle' | translate }}</p>
      </div>
    </ng-template>
  </p-toolbar>

  <!-- Filters -->
  <div class="flex flex-wrap gap-3 items-end">
    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium text-[var(--sam-text)]">{{ 'eventLogs.filters.eventType' | translate }}</label>
      <p-multiselect
        [(ngModel)]="filterEventTypes"
        [options]="eventTypeOptions"
        placeholder="—"
        styleClass="w-72"
      >
        <ng-template let-type #item>
          {{ eventTypeLabel(type) | translate }}
        </ng-template>
      </p-multiselect>
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium text-[var(--sam-text)]">{{ 'eventLogs.filters.userId' | translate }}</label>
      <input
        pInputText
        [(ngModel)]="filterUserId"
        placeholder="user@example.com"
        class="w-56"
        (keyup.enter)="applyFilters()"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium text-[var(--sam-text)]">{{ 'eventLogs.filters.entityType' | translate }}</label>
      <input
        pInputText
        [(ngModel)]="filterEntityType"
        placeholder="document, sheet, …"
        class="w-44"
        (keyup.enter)="applyFilters()"
      />
    </div>

    <div class="flex gap-2">
      <p-button
        icon="pi pi-search"
        (onClick)="applyFilters()"
      />
      <p-button
        icon="pi pi-times"
        severity="secondary"
        [outlined]="true"
        (onClick)="clearFilters()"
      />
    </div>
  </div>

  <app-event-log-table
    [entries]="entries()"
    [totalCount]="totalCount()"
    [loading]="loading()"
    [rows]="rows"
    [page]="currentPage"
    (pageChange)="onPage($event)"
  />
</div>
