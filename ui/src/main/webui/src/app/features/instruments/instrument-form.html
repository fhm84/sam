<form [formGroup]="form" (ngSubmit)="onSave()" class="sam-form">
  <div class="form-field">
    <label for="instrument-id">{{ 'instruments.form.id' | translate }}</label>
    <input pInputText id="instrument-id" formControlName="id" [placeholder]="t.t('instruments.form.idHint')" />
  </div>

  <div class="form-field">
    <label for="instrument-name">{{ 'instruments.form.name' | translate }}</label>
    <input pInputText id="instrument-name" formControlName="name" />
  </div>

  <div class="form-field">
    <label for="instrument-displayName">{{ 'instruments.form.displayName' | translate }}</label>
    <input pInputText id="instrument-displayName" formControlName="displayName" />
  </div>

  <div class="form-field">
    <label for="instrument-transposition">{{ 'instruments.form.transposition' | translate }}</label>
    <p-select
      id="instrument-transposition"
      formControlName="transposition"
      [options]="transpositionOptions"
      [placeholder]="t.t('instruments.form.transpositionPlaceholder')"
      [showClear]="true"
      styleClass="w-full"
    />
  </div>

  <div class="form-actions">
    <p-button
      [label]="t.t('instruments.form.cancel')"
      severity="secondary"
      [text]="true"
      (onClick)="cancelled.emit()"
    />
    <p-button
      [label]="t.t('instruments.form.save')"
      type="submit"
      [disabled]="form.invalid || saving"
      [loading]="saving"
    />
  </div>
</form>
