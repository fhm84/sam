<div class="flex flex-col gap-6">
  <p-toolbar>
    <ng-template #start>
      <p-button
        icon="pi pi-arrow-left"
        [label]="t.t('collections.detail.backToList')"
        [text]="true"
        (onClick)="goBack()"
      />
    </ng-template>
    <ng-template #end>
      @if (collection()) {
        <p-button
          icon="pi pi-pencil"
          [label]="t.t('collections.edit')"
          [text]="true"
          (onClick)="openEdit()"
        />
      }
    </ng-template>
  </p-toolbar>

  @if (collection(); as col) {
    <div class="flex flex-col gap-2">
      <div class="flex items-center gap-3 flex-wrap">
        <h1 class="m-0 text-[1.75rem] font-semibold text-[var(--sam-text)]">{{ col.name }}</h1>
        @if (col.type) {
          <p-tag [value]="'collections.types.' + col.type | translate" severity="secondary" />
        }
      </div>
      @if (col.description) {
        <p class="m-0 text-[var(--sam-text-secondary)] text-[0.95rem]">{{ col.description }}</p>
      }
      @if (col.date) {
        <span class="flex items-center gap-1.5 text-[0.85rem] text-[var(--sam-text-secondary)]">
          <i class="pi pi-calendar text-[0.8rem]"></i> {{ formatDate(col.date) }}
        </span>
      }
    </div>

    <div
      class="flex items-center gap-3 px-4 py-[0.6rem] border border-[var(--sam-border)] rounded-[var(--p-border-radius)]"
      [style.background]="'var(--sam-surface-raised, var(--sam-surface))'"
    >
      <span class="text-[0.78rem] font-semibold uppercase tracking-[0.05em] text-[var(--sam-text-secondary)] mr-1">
        {{ 'collections.detail.actions.label' | translate }}
      </span>
      <p-button
        icon="pi pi-file-export"
        [label]="t.t('collections.detail.actions.generateToc')"
        severity="secondary"
        [outlined]="true"
        size="small"
        (onClick)="generateToc()"
      />
      <p-splitButton
        icon="pi pi-download"
        [label]="t.t('collections.export.zip')"
        [model]="exportMenuItems"
        severity="secondary"
        [outlined]="true"
        size="small"
        (onClick)="exportCollection('ZIP')"
      />
    </div>

    <app-collection-sheets [collectionId]="collectionId()" />
  }
</div>

<p-dialog
  [header]="t.t('collections.edit')"
  [(visible)]="editDialogVisible"
  [modal]="true"
  [style]="{ width: '32rem' }"
>
  @if (editDialogVisible) {
    <app-collection-form
      [collection]="collection()"
      (saved)="onEditSaved()"
      (cancelled)="editDialogVisible = false"
    />
  }
</p-dialog>
