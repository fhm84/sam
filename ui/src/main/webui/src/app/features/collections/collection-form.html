<form [formGroup]="form" (ngSubmit)="onSave()" class="flex flex-col gap-5 pt-4">
  <div class="flex flex-col gap-1.5">
    <p-floatlabel variant="on" class="block">
      <input pInputText id="collection-name" formControlName="name" class="w-full" />
      <label for="collection-name">{{ 'collections.form.name' | translate }}</label>
    </p-floatlabel>
  </div>

  <div class="flex flex-col gap-1.5">
    <p-floatlabel variant="on" class="block">
      <textarea
        pTextarea
        id="collection-description"
        formControlName="description"
        class="w-full"
        [rows]="3"
        [autoResize]="true"
      ></textarea>
      <label for="collection-description">{{ 'collections.form.description' | translate }}</label>
    </p-floatlabel>
  </div>

  <!-- Type + Date -->
  <div class="flex gap-4">
    <div class="flex flex-col gap-1.5 flex-1">
      <p-floatlabel variant="on" class="block">
        <p-select
          inputId="collection-type"
          formControlName="type"
          [options]="typeOptions()"
          optionLabel="label"
          optionValue="value"
          [showClear]="true"
          styleClass="w-full"
          appendTo="body"
        />
        <label for="collection-type">{{ 'collections.form.type' | translate }}</label>
      </p-floatlabel>
    </div>
    @if (isSetlist) {
      <div class="flex flex-col gap-1.5 flex-1">
        <p-floatlabel variant="on" class="block">
          <p-datepicker
            inputId="collection-date"
            formControlName="date"
            [showIcon]="true"
            [showButtonBar]="true"
            dateFormat="dd.mm.yy"
            styleClass="w-full"
            appendTo="body"
          />
          <label for="collection-date">{{ 'collections.form.date' | translate }}</label>
        </p-floatlabel>
      </div>
    }
  </div>

  <!-- Visibility -->
  <div class="grid items-center gap-2 [grid-template-columns:1fr_2rem]">
    <p-floatlabel variant="on" class="block">
      <p-select
        inputId="collection-visibility"
        formControlName="visibility"
        [options]="visibilityOptions()"
        optionLabel="label"
        optionValue="value"
        [showClear]="true"
        styleClass="w-full"
        appendTo="body"
      />
      <label for="collection-visibility">{{ 'collections.form.visibility' | translate }}</label>
    </p-floatlabel>
    <i
      class="pi pi-info-circle justify-self-center text-sm text-[var(--sam-text-muted)] cursor-help transition-colors hover:text-[var(--sam-text-secondary)]"
      [pTooltip]="t.t('collections.form.visibilityTooltip')"
      tooltipPosition="right"
    ></i>
  </div>

  <!-- Ensemble -->
  <div class="grid items-center gap-2 [grid-template-columns:1fr_2rem]">
    <p-floatlabel variant="on" class="block">
      <p-select
        inputId="collection-ensemble"
        formControlName="ensembleId"
        [options]="ensembles()"
        optionLabel="name"
        optionValue="id"
        [showClear]="true"
        styleClass="w-full"
        appendTo="body"
      />
      <label for="collection-ensemble">{{ 'collections.form.ensemble' | translate }}</label>
    </p-floatlabel>
    <i
      class="pi pi-info-circle justify-self-center text-sm text-[var(--sam-text-muted)] cursor-help transition-colors hover:text-[var(--sam-text-secondary)]"
      [pTooltip]="t.t('collections.form.ensembleTooltip')"
      tooltipPosition="right"
    ></i>
  </div>

  <!-- Cover color swatches -->
  <div class="flex flex-col gap-2">
    <span class="text-xs font-semibold tracking-[0.07em] uppercase text-[var(--sam-text-muted)]">
      {{ 'collections.form.coverColor' | translate }}
    </span>
    <div class="flex items-center gap-2 flex-wrap">
      @for (color of coverColors; track color) {
        <button
          type="button"
          class="w-7 h-7 rounded-full border-2 transition-all focus:outline-none"
          [style.background-color]="color"
          [class.border-[var(--p-primary-color)]]="form.controls.coverColor.value === color"
          [class.scale-110]="form.controls.coverColor.value === color"
          [class.border-transparent]="form.controls.coverColor.value !== color"
          [pTooltip]="color"
          tooltipPosition="top"
          (click)="selectCoverColor(color)"
        ></button>
      }
      @if (form.controls.coverColor.value) {
        <button
          type="button"
          class="text-xs text-[var(--sam-text-muted)] hover:text-[var(--sam-text-secondary)] transition-colors ml-1"
          (click)="form.controls.coverColor.setValue(null)"
        >
          {{ 'collections.form.coverColorClear' | translate }}
        </button>
      }
    </div>
  </div>

  <div class="flex justify-end gap-2 pt-2">
    <p-button
      [label]="t.t('collections.cancel')"
      severity="secondary"
      [text]="true"
      (onClick)="cancelled.emit()"
    />
    <p-button
      [label]="t.t('collections.save')"
      type="submit"
      [disabled]="form.invalid || saving"
      [loading]="saving"
    />
  </div>
</form>
