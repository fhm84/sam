<form [formGroup]="form" (ngSubmit)="onSave()" class="sam-form">
  <div class="form-field">
    <p-floatlabel variant="on">
      <input pInputText id="collection-name" formControlName="name" />
      <label for="collection-name">{{ 'collections.form.name' | translate }}</label>
    </p-floatlabel>
  </div>

  <div class="form-field">
    <p-floatlabel variant="on">
      <textarea
        pTextarea
        id="collection-description"
        formControlName="description"
        [rows]="3"
        [autoResize]="true"
      ></textarea>
      <label for="collection-description">{{ 'collections.form.description' | translate }}</label>
    </p-floatlabel>
  </div>

  <div class="form-row">
    <div class="form-field flex-1">
      <p-floatlabel variant="on">
        <p-select
          inputId="collection-type"
          formControlName="type"
          [options]="typeOptions"
          optionLabel="label"
          optionValue="value"
          [showClear]="true"
        />
        <label for="collection-type">{{ 'collections.form.type' | translate }}</label>
      </p-floatlabel>
    </div>
    <div class="form-field flex-1">
      <p-floatlabel variant="on">
        <p-datepicker
          inputId="collection-date"
          formControlName="date"
          [showIcon]="true"
          [showButtonBar]="true"
          dateFormat="dd.mm.yy"
        />
        <label for="collection-date">{{ 'collections.form.date' | translate }}</label>
      </p-floatlabel>
    </div>
  </div>

  <div class="form-actions">
    <p-button
      [label]="t.t('collections.cancel')"
      severity="secondary"
      [text]="true"
      (onClick)="cancelled.emit()"
    />
    <p-button
      [label]="t.t('collections.save')"
      type="submit"
      [disabled]="form.invalid || saving"
      [loading]="saving"
    />
  </div>
</form>
