<form [formGroup]="form" (ngSubmit)="onSave()" class="flex flex-col gap-5 pt-4">

  <!-- Name -->
  <div class="flex flex-col gap-1.5">
    <div class="grid items-center gap-2 [grid-template-columns:1fr_2rem]">
      <p-floatlabel variant="on" class="block">
        <input pInputText id="person-name" formControlName="name" class="w-full" />
        <label for="person-name">{{ 'persons.form.name' | translate }}</label>
      </p-floatlabel>
    </div>
  </div>

  <!-- IPI -->
  <div class="flex flex-col gap-1.5">
    <div class="grid items-center gap-2 [grid-template-columns:1fr_2rem]">
      <p-floatlabel variant="on" class="block">
        <input pInputText id="person-ipi" formControlName="ipi" class="w-full" [placeholder]="t.t('persons.form.ipiHint')" />
        <label for="person-ipi">{{ 'persons.form.ipi' | translate }}</label>
      </p-floatlabel>
      <i
        class="pi pi-info-circle justify-self-center text-sm text-[var(--sam-text-muted)] cursor-help transition-colors hover:text-[var(--sam-text-secondary)]"
        [pTooltip]="t.t('persons.form.ipiTooltip')"
        tooltipPosition="right"
      ></i>
    </div>
  </div>

  <!-- Birth Year / Death Year -->
  <div class="flex gap-4">
    <div class="flex flex-col gap-1.5 flex-1 min-w-0">
      <div class="grid items-center gap-2 [grid-template-columns:1fr_2rem]">
        <p-floatlabel variant="on" class="block">
          <p-inputnumber
            inputId="person-birthYear"
            formControlName="birthYear"
            [useGrouping]="false"
            [maxFractionDigits]="0"
            styleClass="w-full"
            inputStyleClass="w-full"
          />
          <label for="person-birthYear">{{ 'persons.form.birthYear' | translate }}</label>
        </p-floatlabel>
      </div>
    </div>

    <div class="flex flex-col gap-1.5 flex-1 min-w-0">
      <div class="grid items-center gap-2 [grid-template-columns:1fr_2rem]">
        <p-floatlabel variant="on" class="block">
          <p-inputnumber
            inputId="person-deathYear"
            formControlName="deathYear"
            [useGrouping]="false"
            [maxFractionDigits]="0"
            styleClass="w-full"
            inputStyleClass="w-full"
          />
          <label for="person-deathYear">{{ 'persons.form.deathYear' | translate }}</label>
        </p-floatlabel>
      </div>
    </div>
  </div>

  <!-- Credits (edit only): where the person is printed on the music -->
  @if (isEdit && credits(); as list) {
    <div class="flex flex-col gap-2 pt-1 border-t border-[var(--p-surface-200)] dark:border-[var(--p-surface-700)]">
      <span class="text-sm font-medium text-[var(--sam-text-secondary)] mt-2">{{ 'persons.form.credits' | translate }}</span>
      @for (credit of list; track $index) {
        <a
          [routerLink]="['/sheets', credit.sheetId]"
          class="flex items-center justify-between gap-2 text-sm no-underline text-[var(--sam-text)] hover:text-[var(--p-primary-color)]"
        >
          <span class="truncate">{{ credit.title }}</span>
          <span class="text-xs text-[var(--sam-text-muted)] shrink-0">{{ 'persons.creditRole.' + credit.role | translate }}</span>
        </a>
      } @empty {
        <span class="text-sm text-[var(--sam-text-muted)]">{{ 'persons.form.noCredits' | translate }}</span>
      }
    </div>
  }

  <div class="flex justify-end gap-2 pt-2">
    <p-button
      [label]="t.t('persons.cancel')"
      severity="secondary"
      [text]="true"
      (onClick)="cancelled.emit()"
    />
    <p-button
      [label]="t.t('persons.save')"
      type="submit"
      [disabled]="form.invalid || saving"
      [loading]="saving"
    />
  </div>
</form>
