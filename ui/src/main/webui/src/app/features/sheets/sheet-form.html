<form [formGroup]="form" (ngSubmit)="onSave()" class="sam-form">
  <div class="form-field">
    <p-floatlabel variant="on">
      <input pInputText id="sheet-title" formControlName="title" />
      <label for="sheet-title">{{ 'sheets.form.title' | translate }}</label>
    </p-floatlabel>
  </div>

  <div class="form-field">
    <p-floatlabel variant="on">
      <input pInputText id="sheet-subtitle" formControlName="subtitle" />
      <label for="sheet-subtitle">{{ 'sheets.form.subtitle' | translate }}</label>
    </p-floatlabel>
  </div>

  <div class="form-row">
    <div class="form-field flex-1">
      <div class="field-with-hint">
        <p-floatlabel variant="on">
          <p-select
            inputId="sheet-composer"
            formControlName="composerId"
            [options]="musicians()"
            optionLabel="name"
            optionValue="id"
            [filter]="true"
            [showClear]="true"
          />
          <label for="sheet-composer">{{ 'sheets.form.composer' | translate }}</label>
        </p-floatlabel>
        <p-button
          icon="pi pi-plus"
          [rounded]="true"
          [text]="true"
          [pTooltip]="t.t('musicians.new')"
          tooltipPosition="top"
          (onClick)="openMusicianDialog('composer')"
        />
      </div>
    </div>
    <div class="form-field flex-1">
      <div class="field-with-hint">
        <p-floatlabel variant="on">
          <p-select
            inputId="sheet-arranger"
            formControlName="arrangerId"
            [options]="musicians()"
            optionLabel="name"
            optionValue="id"
            [filter]="true"
            [showClear]="true"
          />
          <label for="sheet-arranger">{{ 'sheets.form.arranger' | translate }}</label>
        </p-floatlabel>
        <p-button
          icon="pi pi-plus"
          [rounded]="true"
          [text]="true"
          [pTooltip]="t.t('musicians.new')"
          tooltipPosition="top"
          (onClick)="openMusicianDialog('arranger')"
        />
      </div>
    </div>
  </div>

  <div class="form-row">
    <div class="form-field flex-1">
      <div class="field-with-hint">
        <p-floatlabel variant="on">
          <p-select
            inputId="sheet-genre"
            formControlName="genre"
            [options]="genreOptions()"
            optionLabel="label"
            optionValue="value"
            [showClear]="true"
          />
          <label for="sheet-genre">{{ 'sheets.form.genre' | translate }}</label>
        </p-floatlabel>
        <i class="pi pi-info-circle field-hint-icon"
           [pTooltip]="t.t('sheets.form.genreTooltip')"
           tooltipPosition="right"></i>
      </div>
    </div>
    <div class="form-field flex-1">
      <div class="field-with-hint">
        <p-floatlabel variant="on">
          <p-select
            inputId="sheet-style"
            formControlName="style"
            [options]="styleOptions()"
            optionLabel="label"
            optionValue="value"
            [showClear]="true"
          />
          <label for="sheet-style">{{ 'sheets.form.style' | translate }}</label>
        </p-floatlabel>
        <i class="pi pi-info-circle field-hint-icon"
           [pTooltip]="t.t('sheets.form.styleTooltip')"
           tooltipPosition="right"></i>
      </div>
    </div>
  </div>

  <div class="form-row">
    <div class="form-field flex-1">
      <p-floatlabel variant="on">
        <input pInputText id="sheet-publisher" formControlName="publisher" />
        <label for="sheet-publisher">{{ 'sheets.form.publisher' | translate }}</label>
      </p-floatlabel>
    </div>
    <div class="form-field flex-1">
      <p-floatlabel variant="on">
        <p-inputnumber
          inputId="sheet-year"
          formControlName="yearOfComposition"
          [useGrouping]="false"
          [maxlength]="4"
        />
        <label for="sheet-year">{{ 'sheets.form.yearOfComposition' | translate }}</label>
      </p-floatlabel>
    </div>
  </div>

  <div class="form-row">
    <div class="form-field flex-1">
      <p-floatlabel variant="on">
        <p-select
          inputId="sheet-difficulty"
          formControlName="difficultyLevel"
          [options]="difficultyOptions()"
          optionLabel="label"
          optionValue="value"
          [showClear]="true"
          styleClass="w-full"
        />
        <label for="sheet-difficulty">{{ 'sheets.form.difficultyLevel' | translate }}</label>
      </p-floatlabel>
    </div>
    <div class="form-field flex-1">
      <p-floatlabel variant="on">
        <input pInputText id="sheet-copyright" formControlName="copyright" />
        <label for="sheet-copyright">{{ 'sheets.form.copyright' | translate }}</label>
      </p-floatlabel>
    </div>
  </div>

  <div class="form-field">
    <div class="field-with-hint">
      <p-floatlabel variant="on">
        <p-autocomplete
          inputId="sheet-tags"
          formControlName="tags"
          [multiple]="true"
          [typeahead]="false"
          [addOnBlur]="true"
          [addOnTab]="true"
          separator=","
        />
        <label for="sheet-tags">{{ 'sheets.form.tags' | translate }}</label>
      </p-floatlabel>
      <i class="pi pi-info-circle field-hint-icon"
         [pTooltip]="t.t('sheets.form.tagsTooltip')"
         tooltipPosition="right"></i>
    </div>
  </div>

  <div class="form-field">
    <p-floatlabel variant="on">
      <textarea
        pTextarea
        id="sheet-notes"
        formControlName="additionalNotes"
        [rows]="3"
        [autoResize]="true"
      ></textarea>
      <label for="sheet-notes">{{ 'sheets.form.additionalNotes' | translate }}</label>
    </p-floatlabel>
  </div>

  <div class="form-actions">
    <p-button
      [label]="t.t('sheets.cancel')"
      severity="secondary"
      [text]="true"
      (onClick)="cancelled.emit()"
    />
    <p-button
      [label]="t.t('sheets.save')"
      type="submit"
      [disabled]="form.invalid || saving"
      [loading]="saving"
    />
  </div>
</form>

<p-dialog
  [header]="t.t('musicians.new')"
  [(visible)]="showMusicianDialog"
  [modal]="true"
  [style]="{ width: '28rem' }"
>
  @if (showMusicianDialog) {
    <app-musician-form
      [musician]="null"
      (saved)="onMusicianCreated($event)"
      (cancelled)="showMusicianDialog = false"
    />
  }
</p-dialog>
