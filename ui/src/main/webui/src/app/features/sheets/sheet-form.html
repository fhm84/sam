<form [formGroup]="form" (ngSubmit)="onSave()" class="sam-form">
  <div class="form-field">
    <label for="sheet-title">{{ 'sheets.form.title' | translate }}</label>
    <input pInputText id="sheet-title" formControlName="title" />
  </div>

  <div class="form-field">
    <label for="sheet-subtitle">{{ 'sheets.form.subtitle' | translate }}</label>
    <input pInputText id="sheet-subtitle" formControlName="subtitle" />
  </div>

  <div class="form-row">
    <div class="form-field flex-1">
      <label for="sheet-composer">{{ 'sheets.form.composer' | translate }}</label>
      <p-select
        id="sheet-composer"
        formControlName="composerId"
        [options]="musicians()"
        optionLabel="name"
        optionValue="id"
        [filter]="true"
        [showClear]="true"
        [placeholder]="t.t('sheets.form.composerPlaceholder')"
      />
    </div>
    <div class="form-field flex-1">
      <label for="sheet-arranger">{{ 'sheets.form.arranger' | translate }}</label>
      <p-select
        id="sheet-arranger"
        formControlName="arrangerId"
        [options]="musicians()"
        optionLabel="name"
        optionValue="id"
        [filter]="true"
        [showClear]="true"
        [placeholder]="t.t('sheets.form.arrangerPlaceholder')"
      />
    </div>
  </div>

  <div class="form-row">
    <div class="form-field flex-1">
      <label for="sheet-genre">{{ 'sheets.form.genre' | translate }}</label>
      <input pInputText id="sheet-genre" formControlName="genre" />
    </div>
    <div class="form-field flex-1">
      <label for="sheet-year">{{ 'sheets.form.yearOfComposition' | translate }}</label>
      <p-inputnumber
        id="sheet-year"
        formControlName="yearOfComposition"
        [useGrouping]="false"
        [maxlength]="4"
      />
    </div>
  </div>

  <div class="form-row">
    <div class="form-field flex-1">
      <label for="sheet-publisher">{{ 'sheets.form.publisher' | translate }}</label>
      <input pInputText id="sheet-publisher" formControlName="publisher" />
    </div>
    <div class="form-field flex-1">
      <label for="sheet-edition">{{ 'sheets.form.edition' | translate }}</label>
      <input pInputText id="sheet-edition" formControlName="edition" />
    </div>
  </div>

  <div class="form-row">
    <div class="form-field flex-1">
      <label for="sheet-difficulty">{{ 'sheets.form.difficultyLevel' | translate }}</label>
      <input pInputText id="sheet-difficulty" formControlName="difficultyLevel" />
    </div>
    <div class="form-field flex-1">
      <label for="sheet-copyright">{{ 'sheets.form.copyright' | translate }}</label>
      <input pInputText id="sheet-copyright" formControlName="copyright" />
    </div>
  </div>

  <div class="form-field">
    <label for="sheet-notes">{{ 'sheets.form.additionalNotes' | translate }}</label>
    <textarea
      pTextarea
      id="sheet-notes"
      formControlName="additionalNotes"
      [rows]="3"
      [autoResize]="true"
    ></textarea>
  </div>

  <div class="form-actions">
    <p-button
      [label]="t.t('sheets.cancel')"
      severity="secondary"
      [text]="true"
      (onClick)="cancelled.emit()"
    />
    <p-button
      [label]="t.t('sheets.save')"
      type="submit"
      [disabled]="form.invalid || saving"
      [loading]="saving"
    />
  </div>
</form>
