<form [formGroup]="form" (ngSubmit)="onSave()" class="flex flex-col gap-5">

  <!-- Title -->
  <div class="flex flex-col gap-1.5">
    <div class="grid items-center gap-2 [grid-template-columns:1fr_2rem]">
      <p-floatlabel variant="on" class="block">
        <input pInputText id="sheet-title" formControlName="title" class="w-full" />
        <label for="sheet-title">{{ 'sheets.form.title' | translate }}</label>
      </p-floatlabel>
    </div>
  </div>

  <!-- Subtitle -->
  <div class="flex flex-col gap-1.5">
    <div class="grid items-center gap-2 [grid-template-columns:1fr_2rem]">
      <p-floatlabel variant="on" class="block">
        <input pInputText id="sheet-subtitle" formControlName="subtitle" class="w-full" />
        <label for="sheet-subtitle">{{ 'sheets.form.subtitle' | translate }}</label>
      </p-floatlabel>
    </div>
  </div>

  <!-- Composer / Arranger -->
  <div class="flex gap-4">
    <div class="flex flex-col gap-1.5 flex-1 min-w-0">
      <div class="grid items-center gap-2 [grid-template-columns:1fr_2rem]">
        <p-floatlabel variant="on" class="block">
          <p-select
            inputId="sheet-composer"
            formControlName="composerId"
            [options]="musicians()"
            optionLabel="name"
            optionValue="id"
            [filter]="true"
            [showClear]="true"
            styleClass="w-full"
            inputStyleClass="w-full"
          />
          <label for="sheet-composer">{{ 'sheets.form.composer' | translate }}</label>
        </p-floatlabel>
        <p-button
          icon="pi pi-plus"
          [rounded]="true"
          [text]="true"
          size="small"
          [pTooltip]="t.t('musicians.new')"
          tooltipPosition="top"
          (onClick)="openMusicianDialog('composer')"
        />
      </div>
    </div>
    <div class="flex flex-col gap-1.5 flex-1 min-w-0">
      <div class="grid items-center gap-2 [grid-template-columns:1fr_2rem]">
        <p-floatlabel variant="on" class="block">
          <p-select
            inputId="sheet-arranger"
            formControlName="arrangerId"
            [options]="musicians()"
            optionLabel="name"
            optionValue="id"
            [filter]="true"
            [showClear]="true"
            styleClass="w-full"
            inputStyleClass="w-full"
          />
          <label for="sheet-arranger">{{ 'sheets.form.arranger' | translate }}</label>
        </p-floatlabel>
        <p-button
          icon="pi pi-plus"
          [rounded]="true"
          [text]="true"
          size="small"
          [pTooltip]="t.t('musicians.new')"
          tooltipPosition="top"
          (onClick)="openMusicianDialog('arranger')"
        />
      </div>
    </div>
  </div>

  <!-- Genre / Style -->
  <div class="flex gap-4">
    <div class="flex flex-col gap-1.5 flex-1 min-w-0">
      <div class="grid items-center gap-2 [grid-template-columns:1fr_2rem]">
        <p-floatlabel variant="on" class="block">
          <p-select
            inputId="sheet-genre"
            formControlName="genre"
            [options]="genreOptions()"
            optionLabel="label"
            optionValue="value"
            [showClear]="true"
            styleClass="w-full"
            inputStyleClass="w-full"
          />
          <label for="sheet-genre">{{ 'sheets.form.genre' | translate }}</label>
        </p-floatlabel>
        <i
          class="pi pi-info-circle justify-self-center text-sm text-[var(--sam-text-muted)] cursor-help transition-colors hover:text-[var(--sam-text-secondary)]"
          [pTooltip]="t.t('sheets.form.genreTooltip')"
          tooltipPosition="right"
        ></i>
      </div>
    </div>
    <div class="flex flex-col gap-1.5 flex-1 min-w-0">
      <div class="grid items-center gap-2 [grid-template-columns:1fr_2rem]">
        <p-floatlabel variant="on" class="block">
          <p-select
            inputId="sheet-style"
            formControlName="style"
            [options]="styleOptions()"
            optionLabel="label"
            optionValue="value"
            [showClear]="true"
            styleClass="w-full"
            inputStyleClass="w-full"
          />
          <label for="sheet-style">{{ 'sheets.form.style' | translate }}</label>
        </p-floatlabel>
        <i
          class="pi pi-info-circle justify-self-center text-sm text-[var(--sam-text-muted)] cursor-help transition-colors hover:text-[var(--sam-text-secondary)]"
          [pTooltip]="t.t('sheets.form.styleTooltip')"
          tooltipPosition="right"
        ></i>
      </div>
    </div>
  </div>

  <!-- Publisher / Edition -->
  <div class="flex gap-4">
    <div class="flex flex-col gap-1.5 flex-1 min-w-0">
      <div class="grid items-center gap-2 [grid-template-columns:1fr_2rem]">
        <p-floatlabel variant="on" class="block">
          <input pInputText id="sheet-publisher" formControlName="publisher" class="w-full" />
          <label for="sheet-publisher">{{ 'sheets.form.publisher' | translate }}</label>
        </p-floatlabel>
      </div>
    </div>
    <div class="flex flex-col gap-1.5 flex-1 min-w-0">
      <div class="grid items-center gap-2 [grid-template-columns:1fr_2rem]">
        <p-floatlabel variant="on" class="block">
          <input pInputText id="sheet-edition" formControlName="edition" class="w-full" />
          <label for="sheet-edition">{{ 'sheets.form.edition' | translate }}</label>
        </p-floatlabel>
        <i
          class="pi pi-info-circle justify-self-center text-sm text-[var(--sam-text-muted)] cursor-help transition-colors hover:text-[var(--sam-text-secondary)]"
          [pTooltip]="t.t('sheets.form.editionTooltip')"
          tooltipPosition="right"
        ></i>
      </div>
    </div>
  </div>

  <!-- Year / Difficulty -->
  <div class="flex gap-4">
    <div class="flex flex-col gap-1.5 flex-1 min-w-0">
      <div class="grid items-center gap-2 [grid-template-columns:1fr_2rem]">
        <p-floatlabel variant="on" class="block">
          <p-inputnumber
            inputId="sheet-year"
            formControlName="yearOfComposition"
            [useGrouping]="false"
            [maxlength]="4"
            styleClass="w-full"
            inputStyleClass="w-full"
          />
          <label for="sheet-year">{{ 'sheets.form.yearOfComposition' | translate }}</label>
        </p-floatlabel>
      </div>
    </div>
    <div class="flex flex-col gap-1.5 flex-1 min-w-0">
      <div class="grid items-center gap-2 [grid-template-columns:1fr_2rem]">
        <p-floatlabel variant="on" class="block">
          <p-select
            inputId="sheet-difficulty"
            formControlName="difficultyLevel"
            [options]="difficultyOptions()"
            optionLabel="label"
            optionValue="value"
            [showClear]="true"
            styleClass="w-full"
            inputStyleClass="w-full"
          />
          <label for="sheet-difficulty">{{ 'sheets.form.difficultyLevel' | translate }}</label>
        </p-floatlabel>
        <i
          class="pi pi-info-circle justify-self-center text-sm text-[var(--sam-text-muted)] cursor-help transition-colors hover:text-[var(--sam-text-secondary)]"
          [pTooltip]="t.t('sheets.form.difficultyLevelTooltip')"
          tooltipPosition="right"
        ></i>
      </div>
    </div>
  </div>

  <!-- Copyright / Source -->
  <div class="flex gap-4">
    <div class="flex flex-col gap-1.5 flex-1 min-w-0">
      <div class="grid items-center gap-2 [grid-template-columns:1fr_2rem]">
        <p-floatlabel variant="on" class="block">
          <input pInputText id="sheet-copyright" formControlName="copyright" class="w-full" />
          <label for="sheet-copyright">{{ 'sheets.form.copyright' | translate }}</label>
        </p-floatlabel>
      </div>
    </div>
    <div class="flex flex-col gap-1.5 flex-1 min-w-0">
      <div class="grid items-center gap-2 [grid-template-columns:1fr_2rem]">
        <p-floatlabel variant="on" class="block">
          <input pInputText id="sheet-source" formControlName="source" class="w-full" />
          <label for="sheet-source">{{ 'sheets.form.source' | translate }}</label>
        </p-floatlabel>
        <i
          class="pi pi-info-circle justify-self-center text-sm text-[var(--sam-text-muted)] cursor-help transition-colors hover:text-[var(--sam-text-secondary)]"
          [pTooltip]="t.t('sheets.form.sourceTooltip')"
          tooltipPosition="right"
        ></i>
      </div>
    </div>
  </div>

  <!-- Duration (half-width) / empty right -->
  <div class="flex gap-4">
    <div class="flex flex-col gap-1.5 flex-1 min-w-0">
      <div class="grid items-center gap-2 [grid-template-columns:1fr_0.5rem_1fr_2rem]">
        <p-floatlabel variant="on" class="block">
          <p-inputnumber
            inputId="sheet-duration-min"
            formControlName="durationMinutes"
            [min]="0"
            [useGrouping]="false"
            styleClass="w-full"
            inputStyleClass="w-full"
          />
          <label for="sheet-duration-min">{{ 'sheets.form.durationMinutes' | translate }}</label>
        </p-floatlabel>
        <span class="text-center text-[var(--sam-text-muted)] font-mono text-sm">:</span>
        <p-floatlabel variant="on" class="block">
          <p-inputnumber
            inputId="sheet-duration-sec"
            formControlName="durationSeconds"
            [min]="0"
            [max]="59"
            [useGrouping]="false"
            styleClass="w-full"
            inputStyleClass="w-full"
          />
          <label for="sheet-duration-sec">{{ 'sheets.form.durationSeconds' | translate }}</label>
        </p-floatlabel>
      </div>
    </div>
    <div class="flex-1 min-w-0"></div>
  </div>

  <!-- Tags (full-width) -->
  <div class="flex flex-col gap-1.5">
    <div class="grid items-center gap-2 [grid-template-columns:1fr_2rem]">
      <p-floatlabel variant="on" class="block">
        <p-autocomplete
          inputId="sheet-tags"
          formControlName="tags"
          [multiple]="true"
          [typeahead]="false"
          [addOnBlur]="true"
          [addOnTab]="true"
          separator=","
          styleClass="w-full"
            inputStyleClass="w-full"
        />
        <label for="sheet-tags">{{ 'sheets.form.tags' | translate }}</label>
      </p-floatlabel>
      <i
        class="pi pi-info-circle justify-self-center text-sm text-[var(--sam-text-muted)] cursor-help transition-colors hover:text-[var(--sam-text-secondary)]"
        [pTooltip]="t.t('sheets.form.tagsTooltip')"
        tooltipPosition="right"
      ></i>
    </div>
  </div>

  <!-- Add to collection (create only) -->
  @if (!isEdit) {
    <div class="flex gap-4">
      <div class="flex flex-col gap-1.5 flex-1 min-w-0">
        <div class="grid items-center gap-2 [grid-template-columns:1fr_2rem]">
          <p-floatlabel variant="on" class="block">
            <p-select
              inputId="sheet-collection"
              formControlName="collectionId"
              [options]="collections()"
              optionLabel="name"
              optionValue="id"
              [filter]="true"
              [showClear]="true"
              styleClass="w-full"
              inputStyleClass="w-full"
            />
            <label for="sheet-collection">{{ 'sheets.form.collection' | translate }}</label>
          </p-floatlabel>
          <i
            class="pi pi-info-circle justify-self-center text-sm text-[var(--sam-text-muted)] cursor-help transition-colors hover:text-[var(--sam-text-secondary)]"
            [pTooltip]="t.t('sheets.form.collectionTooltip')"
            tooltipPosition="right"
          ></i>
        </div>
      </div>
      <div class="flex-1 min-w-0"></div>
    </div>
  }

  <!-- Rights & Identifiers -->
  <div class="text-[0.6875rem] font-semibold tracking-[0.07em] uppercase text-[var(--sam-text-muted)] pt-2 border-t border-[var(--sam-border)]">{{ 'sheets.form.rightsSection' | translate }}</div>

  <!-- Rights status / GEMA reportable -->
  <div class="flex gap-4">
    <div class="flex flex-col gap-1.5 flex-1 min-w-0">
      <div class="grid items-center gap-2 [grid-template-columns:1fr_2rem]">
        <p-floatlabel variant="on" class="block">
          <p-select
            inputId="sheet-rights-status"
            formControlName="rightsStatus"
            [options]="rightsStatusOptions()"
            optionLabel="label"
            optionValue="value"
            [showClear]="true"
            styleClass="w-full"
            inputStyleClass="w-full"
          />
          <label for="sheet-rights-status">{{ 'sheets.form.rightsStatus' | translate }}</label>
        </p-floatlabel>
        <i
          class="pi pi-info-circle justify-self-center text-sm text-[var(--sam-text-muted)] cursor-help transition-colors hover:text-[var(--sam-text-secondary)]"
          [pTooltip]="t.t('sheets.form.rightsStatusTooltip')"
          tooltipPosition="right"
        ></i>
      </div>
    </div>
    <div class="flex flex-col gap-1.5 flex-1 min-w-0">
      <div class="grid items-center gap-2 [grid-template-columns:1fr_2rem]">
        <p-floatlabel variant="on" class="block">
          <p-select
            inputId="sheet-gema-reportable"
            formControlName="gemaReportable"
            [options]="gemaReportableOptions()"
            optionLabel="label"
            optionValue="value"
            [showClear]="true"
            styleClass="w-full"
            inputStyleClass="w-full"
          />
          <label for="sheet-gema-reportable">{{ 'sheets.form.gemaReportable' | translate }}</label>
        </p-floatlabel>
        <i
          class="pi pi-info-circle justify-self-center text-sm text-[var(--sam-text-muted)] cursor-help transition-colors hover:text-[var(--sam-text-secondary)]"
          [pTooltip]="t.t('sheets.form.gemaReportableTooltip')"
          tooltipPosition="right"
        ></i>
      </div>
    </div>
  </div>

  <!-- Original by / Publisher IPI -->
  <div class="flex gap-4">
    <div class="flex flex-col gap-1.5 flex-1 min-w-0">
      <div class="grid items-center gap-2 [grid-template-columns:1fr_2rem]">
        <p-floatlabel variant="on" class="block">
          <input pInputText id="sheet-original-by" formControlName="originalBy" class="w-full" />
          <label for="sheet-original-by">{{ 'sheets.form.originalBy' | translate }}</label>
        </p-floatlabel>
        <i
          class="pi pi-info-circle justify-self-center text-sm text-[var(--sam-text-muted)] cursor-help transition-colors hover:text-[var(--sam-text-secondary)]"
          [pTooltip]="t.t('sheets.form.originalByTooltip')"
          tooltipPosition="right"
        ></i>
      </div>
    </div>
    <div class="flex flex-col gap-1.5 flex-1 min-w-0">
      <div class="grid items-center gap-2 [grid-template-columns:1fr_2rem]">
        <p-floatlabel variant="on" class="block">
          <input pInputText id="sheet-publisher-ipi" formControlName="publisherIpi" class="w-full" />
          <label for="sheet-publisher-ipi">{{ 'sheets.form.publisherIpi' | translate }}</label>
        </p-floatlabel>
        <i
          class="pi pi-info-circle justify-self-center text-sm text-[var(--sam-text-muted)] cursor-help transition-colors hover:text-[var(--sam-text-secondary)]"
          [pTooltip]="t.t('sheets.form.publisherIpiTooltip')"
          tooltipPosition="right"
        ></i>
      </div>
    </div>
  </div>

  <!-- GEMA Work No. / ISWC -->
  <div class="flex gap-4">
    <div class="flex flex-col gap-1.5 flex-1 min-w-0">
      <div class="grid items-center gap-2 [grid-template-columns:1fr_2rem]">
        <p-floatlabel variant="on" class="block">
          <input pInputText id="sheet-gema" formControlName="gemaWorkNumber" class="w-full" />
          <label for="sheet-gema">{{ 'sheets.form.gemaWorkNumber' | translate }}</label>
        </p-floatlabel>
        <i
          class="pi pi-info-circle justify-self-center text-sm text-[var(--sam-text-muted)] cursor-help transition-colors hover:text-[var(--sam-text-secondary)]"
          [pTooltip]="t.t('sheets.form.gemaWorkNumberTooltip')"
          tooltipPosition="right"
        ></i>
      </div>
    </div>
    <div class="flex flex-col gap-1.5 flex-1 min-w-0">
      <div class="grid items-center gap-2 [grid-template-columns:1fr_2rem]">
        <p-floatlabel variant="on" class="block">
          <input pInputText id="sheet-iswc" formControlName="iswc" class="w-full" />
          <label for="sheet-iswc">{{ 'sheets.form.iswc' | translate }}</label>
        </p-floatlabel>
        <i
          class="pi pi-info-circle justify-self-center text-sm text-[var(--sam-text-muted)] cursor-help transition-colors hover:text-[var(--sam-text-secondary)]"
          [pTooltip]="t.t('sheets.form.iswcTooltip')"
          tooltipPosition="right"
        ></i>
      </div>
    </div>
  </div>

  <!-- Additional Notes -->
  <div class="text-[0.6875rem] font-semibold tracking-[0.07em] uppercase text-[var(--sam-text-muted)] pt-2 border-t border-[var(--sam-border)]">{{ 'sheets.detail.notes' | translate }}</div>

  <div class="flex flex-col gap-1.5">
    <div class="grid items-start gap-2 [grid-template-columns:1fr_2rem]">
      <p-floatlabel variant="on" class="block">
        <textarea
          pTextarea
          id="sheet-notes"
          formControlName="additionalNotes"
          class="w-full"
          [rows]="3"
          [autoResize]="true"
        ></textarea>
        <label for="sheet-notes">{{ 'sheets.form.additionalNotes' | translate }}</label>
      </p-floatlabel>
    </div>
  </div>

  <div class="flex justify-end gap-2 pt-4 mt-2 border-t border-[var(--sam-border)]">
    <p-button
      [label]="t.t('sheets.cancel')"
      severity="secondary"
      [text]="true"
      (onClick)="cancelled.emit()"
    />
    <p-button
      [label]="t.t('sheets.save')"
      type="submit"
      [disabled]="form.invalid || saving"
      [loading]="saving"
    />
  </div>
</form>

<p-dialog
  [header]="t.t('musicians.new')"
  [(visible)]="showMusicianDialog"
  [modal]="true"
  [style]="{ width: '28rem' }"
>
  @if (showMusicianDialog) {
    <app-musician-form
      [musician]="null"
      (saved)="onMusicianCreated($event)"
      (cancelled)="showMusicianDialog = false"
    />
  }
</p-dialog>
