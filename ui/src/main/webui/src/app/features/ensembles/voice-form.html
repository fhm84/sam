<form [formGroup]="form" (ngSubmit)="onSave()" class="sam-form">
  <div class="form-field">
    <p-floatlabel variant="on">
      <input pInputText id="voice-label" formControlName="label" />
      <label for="voice-label">{{ 'ensembles.voices.form.label' | translate }}</label>
    </p-floatlabel>
  </div>

  <div class="form-row">
    <div class="form-field">
      <div class="field-with-hint">
        <p-floatlabel variant="on">
          <p-inputnumber
            inputId="voice-weight"
            formControlName="weight"
            [useGrouping]="false"
            styleClass="w-full"
          />
          <label for="voice-weight">{{ 'ensembles.voices.form.weight' | translate }}</label>
        </p-floatlabel>
        <i class="pi pi-info-circle field-hint-icon"
           [pTooltip]="t.t('ensembles.voices.form.weightTooltip')"
           tooltipPosition="right"></i>
      </div>
    </div>

    <div class="form-field form-field--checkbox">
      <p-checkbox
        inputId="voice-required"
        formControlName="required"
        [binary]="true"
      />
      <div class="checkbox-label-row">
        <label for="voice-required">{{ 'ensembles.voices.form.required' | translate }}</label>
        <i class="pi pi-info-circle field-hint-icon"
           [pTooltip]="t.t('ensembles.voices.form.requiredTooltip')"
           tooltipPosition="right"></i>
      </div>
    </div>
  </div>

  <div class="form-actions">
    <p-button
      [label]="t.t('ensembles.voices.cancel')"
      severity="secondary"
      [text]="true"
      (onClick)="cancelled.emit()"
    />
    <p-button
      [label]="t.t('ensembles.voices.save')"
      type="submit"
      [disabled]="form.invalid || saving"
      [loading]="saving"
    />
  </div>
</form>
