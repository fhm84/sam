<form [formGroup]="form" (ngSubmit)="onSave()" class="flex flex-col gap-5">
  <div class="flex flex-col gap-1.5">
    <p-floatlabel variant="on" class="block">
      <p-select
        inputId="option-instrument"
        formControlName="instrumentId"
        [options]="instrumentOptions()"
        optionLabel="label"
        optionValue="value"
        [filter]="true"
        styleClass="w-full"
        appendTo="body"
      />
      <label for="option-instrument">{{ 'ensembles.voices.options.form.instrument' | translate }}</label>
    </p-floatlabel>
  </div>

  <div class="flex gap-4">
    <div class="flex flex-col gap-1.5 flex-1">
      <div class="flex items-center gap-2">
        <p-floatlabel variant="on" class="flex-1 min-w-0 block">
          <p-select
            inputId="option-type"
            formControlName="type"
            [options]="typeOptions"
            [showClear]="true"
            styleClass="w-full"
            appendTo="body"
          />
          <label for="option-type">{{ 'ensembles.voices.options.form.type' | translate }}</label>
        </p-floatlabel>
        <i
          class="pi pi-info-circle text-xs text-[var(--sam-text-muted)] cursor-help shrink-0 transition-colors hover:text-[var(--sam-text-secondary)]"
          [pTooltip]="t.t('ensembles.voices.options.form.typeTooltip')"
          tooltipPosition="right"
        ></i>
      </div>
    </div>

    <div class="flex flex-col gap-1.5 flex-1">
      <div class="flex items-center gap-2">
        <p-floatlabel variant="on" class="flex-1 min-w-0 block">
          <p-inputnumber
            inputId="option-factor"
            formControlName="factor"
            [useGrouping]="false"
            styleClass="w-full"
          />
          <label for="option-factor">{{ 'ensembles.voices.options.form.factor' | translate }}</label>
        </p-floatlabel>
        <i
          class="pi pi-info-circle text-xs text-[var(--sam-text-muted)] cursor-help shrink-0 transition-colors hover:text-[var(--sam-text-secondary)]"
          [pTooltip]="t.t('ensembles.voices.options.form.factorTooltip')"
          tooltipPosition="right"
        ></i>
      </div>
    </div>
  </div>

  <div class="flex justify-end gap-2 pt-2">
    <p-button
      [label]="t.t('ensembles.voices.options.cancel')"
      severity="secondary"
      [text]="true"
      (onClick)="cancelled.emit()"
    />
    <p-button
      [label]="t.t('ensembles.voices.options.save')"
      type="submit"
      [disabled]="form.invalid || saving"
      [loading]="saving"
    />
  </div>
</form>
