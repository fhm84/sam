<form [formGroup]="form" (ngSubmit)="onSave()" class="sam-form">
  <div class="form-field">
    <p-floatlabel variant="on">
      <input pInputText id="ensemble-name" formControlName="name" />
      <label for="ensemble-name">{{ 'ensembles.form.name' | translate }}</label>
    </p-floatlabel>
  </div>

  <div class="form-field">
    <p-floatlabel variant="on">
      <textarea
        pTextarea
        id="ensemble-description"
        formControlName="description"
        [rows]="3"
        [autoResize]="true"
      ></textarea>
      <label for="ensemble-description">{{ 'ensembles.form.description' | translate }}</label>
    </p-floatlabel>
  </div>

  <div class="form-actions">
    <p-button
      [label]="t.t('ensembles.cancel')"
      severity="secondary"
      [text]="true"
      (onClick)="cancelled.emit()"
    />
    <p-button
      [label]="t.t('ensembles.save')"
      type="submit"
      [disabled]="form.invalid || saving"
      [loading]="saving"
    />
  </div>
</form>
