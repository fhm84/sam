<div class="flex flex-col gap-6">
  <p-toolbar>
    <ng-template #start>
      <p-button
        icon="pi pi-arrow-left"
        [label]="t.t('ensembles.detail.backToList')"
        [text]="true"
        (onClick)="goBack()"
      />
    </ng-template>
    <ng-template #end>
      @if (ensemble()) {
        <p-button
          icon="pi pi-pencil"
          [label]="t.t('ensembles.edit')"
          [text]="true"
          (onClick)="openEdit()"
        />
      }
    </ng-template>
  </p-toolbar>

  @if (ensemble(); as ens) {
    <div class="flex flex-col gap-1">
      <h1 class="m-0 text-2xl font-semibold text-[var(--sam-text)]">{{ ens.name }}</h1>
      @if (ens.description) {
        <p class="m-0 text-sm text-[var(--sam-text-secondary)]">{{ ens.description }}</p>
      }
    </div>

    <app-ensemble-voices [ensembleId]="ensembleId()" />
    <app-ensemble-memberships [ensembleId]="ensembleId()" />
  }
</div>

<p-dialog
  [header]="t.t('ensembles.edit')"
  [(visible)]="editDialogVisible"
  [modal]="true"
  [style]="{ width: '28rem' }"
>
  @if (editDialogVisible) {
    <app-ensemble-form
      [ensemble]="ensemble()"
      (saved)="onEditSaved()"
      (cancelled)="editDialogVisible = false"
    />
  }
</p-dialog>
