# Quinoa Konfiguration
#quarkus.quinoa.package-manager-install=true
#quarkus.quinoa.package-manager-install.node-version=22.12.0
quarkus.quinoa.package-manager=npm

# Angular specific
quarkus.quinoa.build-dir=dist/sam/browser
quarkus.quinoa.package-manager-command.install=install
quarkus.quinoa.package-manager-command.build=run build

# activate SPA Routing
quarkus.quinoa.enable-spa-routing=true

# Dev-Modus: Quinoa starts Angular Dev-Server
%dev.quarkus.quinoa.dev-server=true
%dev.quarkus.quinoa.dev-server.port=4200
%dev.quarkus.quinoa.dev-server.check-timeout=60000

# Test-Modus: deactivate UI Build
%test.quarkus.quinoa.enabled=false
