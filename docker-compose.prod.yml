services:

  # Edge: Caddy + the Angular SPA (see Dockerfile, docker/Caddyfile). The only service
  # published to the internet: terminates TLS, serves the SPA, proxies /api/* and
  # /oidc-config.json to sam-server, and ${KEYCLOAK_DOMAIN} to keycloak.
  sam-ui:
    build:
      context: .
      dockerfile: Dockerfile
    image: de.halbmann/sam-ui:latest
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SAM_DOMAIN: ${SAM_DOMAIN:?SAM_DOMAIN is required}
      KEYCLOAK_DOMAIN: ${KEYCLOAK_DOMAIN:?KEYCLOAK_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default:
        # sam-server validates tokens against the public issuer URL; the alias keeps
        # that request on the internal network instead of leaving via the public IP.
        aliases:
          - ${KEYCLOAK_DOMAIN}
    depends_on:
      - sam-server
      - keycloak
    mem_limit: 256m
    restart: unless-stopped

  # Keycloak: OIDC provider. Imports keycloak/prod/sam-realm.json on first boot only
  # (no dev users or dev secrets; ${...} placeholders are filled from the env below).
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: start --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_POOL_MAX_SIZE: "20"
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASS:?KEYCLOAK_DB_PASS is required}
      KC_HOSTNAME: https://${KEYCLOAK_DOMAIN:?KEYCLOAK_DOMAIN is required}
      KC_HTTP_ENABLED: "true" # TLS terminates at Caddy
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: "-Xms256m -Xmx768m"
      # Filled into keycloak/prod/sam-realm.json at import
      SAM_DOMAIN: ${SAM_DOMAIN:?SAM_DOMAIN is required}
      KEYCLOAK_BACKEND_CLIENT_SECRET: ${KEYCLOAK_BACKEND_CLIENT_SECRET:?KEYCLOAK_BACKEND_CLIENT_SECRET is required}
      KEYCLOAK_CLI_CLIENT_SECRET: ${KEYCLOAK_CLI_CLIENT_SECRET:?KEYCLOAK_CLI_CLIENT_SECRET is required}
    volumes:
      - ./keycloak/prod:/opt/keycloak/data/import:ro
    mem_limit: 1280m
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'exec 3<>/dev/tcp/127.0.0.1/9000; echo -e ''GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n'' >&3; grep -q ''"status": "UP"'' <&3'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  keycloak-db:
    image: postgres:17
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=50"]
    mem_limit: 384m
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASS:?KEYCLOAK_DB_PASS is required}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Quarkus backend: REST API + OIDC config endpoint
  sam-server:
    image: de.halbmann/sam:latest
    environment:
      # Database
      DB_URL: jdbc:postgresql://database:5432/sam_music
      DB_USER: ${DB_USER:-sam}
      DB_PASS: ${DB_PASS:?DB_PASS is required}
      # OIDC / Keycloak (token validation + oidc-config.json endpoint)
      OIDC_SERVER_URL: ${OIDC_SERVER_URL:?OIDC_SERVER_URL is required}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-sam-ui}
      # Keycloak admin client (used for user search in musician linking)
      KEYCLOAK_ADMIN_URL: ${KEYCLOAK_ADMIN_URL:?KEYCLOAK_ADMIN_URL is required}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-sam}
      KEYCLOAK_BACKEND_CLIENT_ID: ${KEYCLOAK_BACKEND_CLIENT_ID:-sam-backend}
      KEYCLOAK_BACKEND_CLIENT_SECRET: ${KEYCLOAK_BACKEND_CLIENT_SECRET:?KEYCLOAK_BACKEND_CLIENT_SECRET is required}
      # AI — OpenAI for document classification
      QUARKUS_LANGCHAIN4J_OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      # Storage: local filesystem path inside the container
      SAM_FILESYSTEM_BASE_PATH: /data/sam
      # Heap 1 GB inside a 1.5 GB container (rest: metaspace, threads, PDF rendering buffers).
      # Exit on OOM so the restart policy brings it back instead of leaving it half-alive.
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx1g -XX:+ExitOnOutOfMemoryError"
    volumes:
      - sam-data:/data/sam
    depends_on:
      database:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    mem_limit: 1536m
    restart: unless-stopped

  database:
    image: postgres:17
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50"]
    mem_limit: 768m
    environment:
      POSTGRES_USER: ${DB_USER:-sam}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS is required}
      POSTGRES_DB: sam_music
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sam} -d sam_music"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Helpers for scripts/backup/{backup,restore}.sh — not started with the stack (profile "backup").
  # BACKUP_DIR is exported by those scripts.
  backup-files:
    image: alpine:3
    profiles: ["backup"]
    entrypoint: ["tar"]
    volumes:
      - sam-data:/data:ro
      - ${BACKUP_DIR:-./backups}:/out

  restore-files:
    image: alpine:3
    profiles: ["backup"]
    volumes:
      - sam-data:/data
      - ${BACKUP_DIR:-./backups}:/in:ro

volumes:
  postgres-data:
  sam-data:
  keycloak-db-data:
  caddy-data:
  caddy-config:
