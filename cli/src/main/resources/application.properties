quarkus.arc.remove-unused-beans=false
# CLI application name
quarkus.application.name=cli
# Disable banner for cleaner CLI output
quarkus.banner.enabled=false
# CLI diagnostics toggle (set to true to enable runtime diagnostics)
sam.cli.diagnostics.enabled=true
# Diagnostics log category: set level via namespaced property (default INFO)
# Example: -Dsam.cli.diagnostics.level=DEBUG
quarkus.log.category."de.halbmann.sam.cli.diagnostics".level=${sam.cli.diagnostics.level:INFO}
# REST Client configuration
quarkus.rest-client."sam-api".url=http://localhost:8080/api
quarkus.rest-client."de.halbmann.sam.api.boundary.SamResources".url=http://localhost:8080/api
quarkus.rest-client."de.halbmann.sam.api.boundary.SamResources".scope=jakarta.inject.Singleton
# Optional: Configure timeouts
quarkus.rest-client."de.halbmann.sam.api.boundary.SamResources".connect-timeout=5000
quarkus.rest-client."de.halbmann.sam.api.boundary.SamResources".read-timeout=30000

# OIDC client-credentials auth: acquires a service-account bearer token and attaches it to every
# SamResources call. discovery-enabled=false + early-tokens-acquisition=false keep this lazy (no
# network call at CLI startup) so plain `mvn test`/dry-run usage stays hermetic.
quarkus.rest-client."de.halbmann.sam.api.boundary.SamResources".providers=io.quarkus.oidc.client.reactive.filter.OidcClientRequestReactiveFilter
quarkus.oidc-client.discovery-enabled=false
quarkus.oidc-client.token-path=/protocol/openid-connect/token
quarkus.oidc-client.grant.type=client
quarkus.oidc-client.early-tokens-acquisition=false
# dev-safe defaults (also used by tests, which never exercise a real network call through the
# filter); %prod overrides to the real deployment's Keycloak via env vars.
quarkus.oidc-client.auth-server-url=http://localhost:8180/realms/sam
quarkus.oidc-client.client-id=sam-cli
quarkus.oidc-client.credentials.secret=sam-cli-secret
%prod.quarkus.oidc-client.auth-server-url=${OIDC_SERVER_URL}
%prod.quarkus.oidc-client.client-id=${SAM_CLI_CLIENT_ID:sam-cli}
%prod.quarkus.oidc-client.credentials.secret=${SAM_CLI_CLIENT_SECRET}

# Logging configuration
quarkus.log.level=INFO
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n
