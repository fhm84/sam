quarkus.arc.remove-unused-beans=false
# CLI application name
quarkus.application.name=cli
# Disable banner for cleaner CLI output
quarkus.banner.enabled=false
# CLI diagnostics toggle (set to true to log registered subcommands at startup)
sam.cli.diagnostics.enabled=false
# Diagnostics log category: set level via namespaced property (default INFO)
# Example: -Dsam.cli.diagnostics.level=DEBUG
quarkus.log.category."de.halbmann.sam.cli.diagnostics".level=${sam.cli.diagnostics.level:INFO}

# REST Client configuration — keyed by the configKey declared on
# @RegisterRestClient(configKey = "sam-api") in SamResources. Do NOT key entries by the
# fully-qualified interface name: when a configKey is set, FQCN-keyed entries are ignored.
quarkus.rest-client."sam-api".url=http://localhost:8080/api
quarkus.rest-client."sam-api".scope=jakarta.inject.Singleton
quarkus.rest-client."sam-api".connect-timeout=5000
quarkus.rest-client."sam-api".read-timeout=30000

# OIDC client-credentials auth: acquires a service-account bearer token and attaches it to every
# SamResources call. discovery-enabled=false + early-tokens-acquisition=false keep this lazy (no
# network call at CLI startup) so plain `mvn test`/dry-run usage stays hermetic.
quarkus.rest-client."sam-api".providers=io.quarkus.oidc.client.reactive.filter.OidcClientRequestReactiveFilter
quarkus.oidc-client.discovery-enabled=false
quarkus.oidc-client.grant.type=client
quarkus.oidc-client.early-tokens-acquisition=false
# One setting selects the provider, SAM_OIDC_PROVIDER = pocket-id (default) or keycloak, as in
# server. OidcProviderConfigSourceFactory then loads oidc/<provider>.properties with the issuer
# (OIDC_SERVER_URL, default: the provider's dev URL), token path, dev secret and token request
# options; don't repeat those keys here.
sam.oidc.provider=pocket-id
quarkus.oidc-client.client-id=sam-cli
%prod.quarkus.oidc-client.client-id=${SAM_CLI_CLIENT_ID:sam-cli}
# no default on purpose: prod must fail fast instead of silently using the committed dev secret
%prod.quarkus.oidc-client.credentials.secret=${SAM_CLI_CLIENT_SECRET}

# Logging configuration
quarkus.log.level=INFO
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n
