# Token settings for Pocket ID (the default), loaded when sam.oidc.provider=pocket-id
# (OidcProviderConfigSourceFactory). OIDC_SERVER_URL is the same variable server uses; the
# default is the dev Pocket ID (docker-compose.yml).
quarkus.oidc-client.auth-server-url=${OIDC_SERVER_URL:http://localhost:1411}
quarkus.oidc-client.token-path=/api/oidc/token
# dev-only secret set by scripts/pocketid/seed-dev.sh (also used by tests, which never reach the
# token endpoint); prod reads SAM_CLI_CLIENT_SECRET (application.properties)
quarkus.oidc-client.credentials.secret=sam-cli-dev-secret-0000
# The token must be requested for the SAM API resource, or it carries no permissions (= roles) in
# `scp`; server routes tokens with this audience to its m2m tenant
quarkus.oidc-client.grant-options.client.resource=urn:sam:api
