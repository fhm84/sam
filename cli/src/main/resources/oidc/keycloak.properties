# Token settings for Keycloak, loaded when sam.oidc.provider=keycloak (OidcProviderConfigSourceFactory).
# OIDC_SERVER_URL is the same variable server uses; the default is the dev Keycloak.
quarkus.oidc-client.auth-server-url=${OIDC_SERVER_URL:http://localhost:8180/realms/sam}
quarkus.oidc-client.token-path=/protocol/openid-connect/token
# dev-only secret (also used by tests, which never reach the token endpoint); prod reads
# SAM_CLI_CLIENT_SECRET (application.properties)
quarkus.oidc-client.credentials.secret=sam-cli-secret
