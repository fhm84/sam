# OIDC settings for Pocket ID (the default), loaded when sam.oidc.provider=pocket-id
# (OidcProviderConfigSourceFactory). Shared settings and the prod issuer URL (OIDC_SERVER_URL)
# stay in application.properties.

# Dev: local Pocket ID (docker-compose.pocketid.yml, seeded by scripts/pocketid/seed-dev.sh)
%dev.quarkus.oidc.auth-server-url=http://localhost:1411

# Pocket ID puts a user's groups (= SAM roles) only into the ID token and userinfo, never into the
# access token (pocket-id#1389), so user tokens get their roles from userinfo (cached per token).
quarkus.oidc.authentication.user-info-required=true
quarkus.oidc.roles.source=userinfo
quarkus.oidc.roles.role-claim-path=groups
quarkus.oidc.token-cache.max-size=1000
# A shared Pocket ID issues tokens to other apps too: accept only those issued to SAM's UI client
# (Pocket ID puts the client ID into `aud`)
quarkus.oidc.token.audience=${quarkus.oidc.client-id:sam-ui}
# Groups are global on Pocket ID, so SAM roles come only from SAM-specific groups (RoleGroups)
sam.oidc.role-groups.admin=sam-admin
sam.oidc.role-groups.music_librarian=sam-music-librarian

# The CLI's client-credentials token has no userinfo; ClientCredentialsTenantResolver routes tokens
# for the API audience to the `m2m` tenant, which reads the roles from the API permissions in `scp`
# and insists on that audience.
sam.oidc.m2m-audience=urn:sam:api
quarkus.oidc.m2m.auth-server-url=${quarkus.oidc.auth-server-url}
quarkus.oidc.m2m.token.audience=${sam.oidc.m2m-audience}
quarkus.oidc.m2m.roles.role-claim-path=scp

# What /oidc-config.json tells the UI: Pocket ID only emits `groups` when asked for it, and the UI
# falls back to the ID token when the access token lacks the role claim
sam.oidc.ui.scope=openid profile email groups
sam.oidc.ui.role-claim-path=groups
