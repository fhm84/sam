# OIDC settings for Keycloak, loaded when sam.oidc.provider=keycloak (OidcProviderConfigSourceFactory).
# Shared settings and the prod issuer URL (OIDC_SERVER_URL) stay in application.properties.

# Roles come from the realm roles in the access token
quarkus.oidc.roles.role-claim-path=realm_access/roles
# Accept only tokens meant for the SAM API: the realm's sam-ui and sam-cli clients add this
# audience (protocol mapper `sam-api-audience`), tokens of other clients in the realm lack it
quarkus.oidc.token.audience=urn:sam:api

# Dev: local Keycloak (docker-compose.keycloak.yml)
%dev.quarkus.oidc.auth-server-url=http://localhost:8180/realms/sam

# What /oidc-config.json tells the UI: login scopes and the (dot-separated) role claim
sam.oidc.ui.scope=openid profile email
sam.oidc.ui.role-claim-path=realm_access.roles

# Keycloak Admin Client — used for user search in member-user linking
# Uses a dedicated sam-backend service account with view-users role (least privilege)
%dev.quarkus.keycloak.admin-client.server-url=http://localhost:8180
%dev.quarkus.keycloak.admin-client.realm=sam
%dev.quarkus.keycloak.admin-client.client-id=sam-backend
%dev.quarkus.keycloak.admin-client.client-secret=sam-backend-secret
%dev.quarkus.keycloak.admin-client.grant-type=CLIENT_CREDENTIALS
# Prod: configure via environment variables
%prod.quarkus.keycloak.admin-client.server-url=${KEYCLOAK_ADMIN_URL}
%prod.quarkus.keycloak.admin-client.realm=${KEYCLOAK_REALM:sam}
%prod.quarkus.keycloak.admin-client.client-id=${KEYCLOAK_BACKEND_CLIENT_ID:sam-backend}
%prod.quarkus.keycloak.admin-client.client-secret=${KEYCLOAK_BACKEND_CLIENT_SECRET}
%prod.quarkus.keycloak.admin-client.grant-type=CLIENT_CREDENTIALS
