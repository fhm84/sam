# Database
quarkus.datasource.db-kind=postgresql
# Dev-Modus: Docker-DB, Dev Services deaktiviert
%dev.quarkus.datasource.username=sam
%dev.quarkus.datasource.password=s4mP@ssword
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/sam_music
%dev.quarkus.datasource.devservices.enabled=false
# Dev only: Hibernate may add mapped columns to the local DB for fast iteration. Every schema
# change still needs a Flyway migration; FlywaySchemaValidationTest fails in CI otherwise.
%dev.quarkus.hibernate-orm.schema-management.strategy=update

# Tests: Dev Services auto (no URL!); the schema comes from the Flyway migrations only
%test.quarkus.hibernate-orm.schema-management.strategy=none

# Prod: Externe DB konfigurieren
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USER:sam}
%prod.quarkus.datasource.password=${DB_PASS}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/sam_music}

# Prod: Flyway owns the schema; Hibernate only checks that the entities match it and refuses
# to start on drift instead of silently altering the production schema.
%prod.quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.implicit_naming_strategy=component-path
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.hibernate-envers.audit-strategy=org.hibernate.envers.strategy.ValidityAuditStrategy
quarkus.hibernate-orm.log.sql=false
# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0
quarkus.rest-client.logging.scope=all
quarkus.rest-client.logging.body-limit=100
%dev.quarkus.flyway.repair-at-start=true
# for larger uploads
#quarkus.http.limits.max-body-size=2G
quarkus.langchain4j.chat-model.provider=openai
#quarkus.langchain4j.chat-model.provider=ollama
quarkus.langchain4j.openai.chat-model.enabled=true
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o
quarkus.langchain4j.ai.gemini.chat-model.enabled=false
quarkus.langchain4j.vertexai.gemini.location=local
quarkus.langchain4j.vertexai.gemini.project-id=${GCP_PROJECT_ID:}
quarkus.langchain4j.ai.gemini.chat-model.model-id=gemini-2.0-flash
quarkus.langchain4j.ollama.chat-model.enabled=false
#quarkus.langchain4j.ollama.chat-model.model-id=mistral
quarkus.langchain4j.ollama.chat-model.model-id=llava
#quarkus.langchain4j.ollama.chat-model.model-id=deepseek-r1
quarkus.langchain4j.ollama.embedding-model.model-id=nomic-embed-text
quarkus.langchain4j.ollama.base-url=http://localhost:11434
quarkus.langchain4j.ollama.timeout=120s
#langchain4j-ollama-dev-service.ollama.host=localhost
#langchain4j-ollama-dev-service.ollama.port=11434
#langchain4j-ollama-dev-service.ollama.endpoint=http://${langchain4j-ollama-dev-service.ollama.host}:${langchain4j-ollama-dev-service.ollama.port}
quarkus.banner.path=banner.txt

# OIDC: one setting selects the provider, SAM_OIDC_PROVIDER = pocket-id (default) or keycloak.
# OidcProviderConfigSourceFactory then loads oidc/<provider>.properties with everything that
# differs per provider; don't repeat its keys here. Only the issuer URL and client ID are shared.
# Dev runs Pocket ID from docker-compose.yml; Keycloak in dev (docker-compose.keycloak.yml):
#   ./mvnw quarkus:dev -pl server -Dsam.oidc.provider=keycloak
sam.oidc.provider=pocket-id
quarkus.oidc.application-type=service
%dev.quarkus.oidc.client-id=sam-ui

# Realm whose users are exposed via /api/admin/users (Keycloak only)
sam.admin.keycloak.realm=${KEYCLOAK_REALM:sam}

# Test: disable OIDC so existing tests keep passing (use @TestSecurity for auth-specific tests)
%test.quarkus.oidc.enabled=false

# Prod: configure via environment variables
%prod.quarkus.oidc.auth-server-url=${OIDC_SERVER_URL}
%prod.quarkus.oidc.client-id=${OIDC_CLIENT_ID:sam-ui}

# Metrics for Prometheus scrape endpoint: GET /q/metrics
# Histogram buckets for classification/enrichment timers
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.export.prometheus.enabled=true

# Management interface: moves ops endpoints (/q/metrics, /q/info, ...) off the
# main HTTP port onto a dedicated, unauthenticated port. Port 9000 is the
# canonical value referenced by monitoring/prometheus.yml
# — keep it in sync if this changes. See docs/architecture/decisions/.
quarkus.management.enabled=true
quarkus.management.port=9000
# Bind to all interfaces in dev too, so the monitoring stack's Prometheus
# container (reaching the host via host.docker.internal / host-gateway, not
# loopback) can scrape :9000 during `quarkus:dev` — the default host binding
# for the management interface is localhost-only outside prod launch mode.
%dev.quarkus.management.host=0.0.0.0

# Application info endpoint: GET /q/info (management port, unauthenticated) —
# branch/commit/build-id for a running deployment. Deliberately NOT
# git.mode=full: full mode also exposes commit author/committer name+email
# and the build machine's hostname, which is more than this endpoint should
# leak to anonymous callers.
quarkus.info.git.mode=standard

# SAM default configs
sam.coverage.base-score=0.7
# Agentic classification (second LLM pass that resolves entities via tool calls) is opt-in.
# Enable per environment with the env var SAM_CLASSIFICATION_AGENTIC=true.
sam.classification.agentic=false

# Storage: local filesystem path. Required in prod (set via SAM_FILESYSTEM_BASE_PATH env var).
%dev.sam.filesystem.base.path=./data/sam
%prod.sam.filesystem.base.path=${SAM_FILESYSTEM_BASE_PATH:/data/sam}

# Container image (Jib) — trigger with -Dquarkus.container-image.build=true -pl server -am
quarkus.container-image.registry=ghcr.io
quarkus.container-image.group=fhm84
quarkus.container-image.name=sam
quarkus.container-image.tag=latest
# OCI labels (source, revision, version, ...) are passed in by CI (ci.yml, ADR-0012)
