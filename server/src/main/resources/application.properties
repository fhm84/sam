# Database
quarkus.datasource.db-kind=postgresql
# Dev-Modus: Docker-DB, Dev Services deaktiviert
%dev.quarkus.datasource.username=sam
%dev.quarkus.datasource.password=s4mP@ssword
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/sam_music
%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.hibernate-orm.database.generation=update

# Tests: Dev Services auto (keine URL!), drop-and-create für Clean-State
%test.quarkus.hibernate-orm.database.generation=drop-and-create

# Prod: Externe DB konfigurieren
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USER:sam}
%prod.quarkus.datasource.password=${DB_PASS:s4mP@ssword}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/sam_music}

quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.implicit_naming_strategy=component-path
quarkus.hibernate-envers.audit-strategy=org.hibernate.envers.strategy.ValidityAuditStrategy
quarkus.hibernate-orm.log.sql=true
# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0
quarkus.rest-client.logging.scope=all
quarkus.rest-client.logging.body-limit=100
# for larger uploads
#quarkus.http.limits.max-body-size=2G
quarkus.langchain4j.chat-model.provider=openai
#quarkus.langchain4j.chat-model.provider=ollama
quarkus.langchain4j.openai.chat-model.enabled=true
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o
quarkus.langchain4j.ai.gemini.chat-model.enabled=false
quarkus.langchain4j.vertexai.gemini.location=local
quarkus.langchain4j.vertexai.gemini.project-id=470958450342
quarkus.langchain4j.ai.gemini.chat-model.model-id=gemini-2.0-flash
quarkus.langchain4j.ollama.chat-model.enabled=false
#quarkus.langchain4j.ollama.chat-model.model-id=mistral
quarkus.langchain4j.ollama.chat-model.model-id=llava
#quarkus.langchain4j.ollama.chat-model.model-id=deepseek-r1
quarkus.langchain4j.ollama.embedding-model.model-id=nomic-embed-text
quarkus.langchain4j.ollama.base-url=http://localhost:11434
quarkus.langchain4j.ollama.timeout=120s
#langchain4j-ollama-dev-service.ollama.host=localhost
#langchain4j-ollama-dev-service.ollama.port=11434
#langchain4j-ollama-dev-service.ollama.endpoint=http://${langchain4j-ollama-dev-service.ollama.host}:${langchain4j-ollama-dev-service.ollama.port}
quarkus.banner.path=banner.txt

# SAM default configs
sam.coverage.base-score=0.7