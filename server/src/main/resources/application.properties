# Database
quarkus.datasource.db-kind=postgresql
# Dev-Modus: Docker-DB, Dev Services deaktiviert
%dev.quarkus.datasource.username=sam
%dev.quarkus.datasource.password=s4mP@ssword
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/sam_music
%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.hibernate-orm.database.generation=update

# Tests: Dev Services auto (no URL!), drop-and-create for Clean-State
%test.quarkus.hibernate-orm.database.generation=drop-and-create

# Prod: Externe DB konfigurieren
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USER:sam}
%prod.quarkus.datasource.password=${DB_PASS:s4mP@ssword}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/sam_music}

quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.implicit_naming_strategy=component-path
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.hibernate-envers.audit-strategy=org.hibernate.envers.strategy.ValidityAuditStrategy
quarkus.hibernate-orm.log.sql=false
# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0
quarkus.rest-client.logging.scope=all
quarkus.rest-client.logging.body-limit=100
%dev.quarkus.flyway.repair-at-start=true
# for larger uploads
#quarkus.http.limits.max-body-size=2G
quarkus.langchain4j.chat-model.provider=openai
#quarkus.langchain4j.chat-model.provider=ollama
quarkus.langchain4j.openai.chat-model.enabled=true
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o
quarkus.langchain4j.ai.gemini.chat-model.enabled=false
quarkus.langchain4j.vertexai.gemini.location=local
quarkus.langchain4j.vertexai.gemini.project-id=470958450342
quarkus.langchain4j.ai.gemini.chat-model.model-id=gemini-2.0-flash
quarkus.langchain4j.ollama.chat-model.enabled=false
#quarkus.langchain4j.ollama.chat-model.model-id=mistral
quarkus.langchain4j.ollama.chat-model.model-id=llava
#quarkus.langchain4j.ollama.chat-model.model-id=deepseek-r1
quarkus.langchain4j.ollama.embedding-model.model-id=nomic-embed-text
quarkus.langchain4j.ollama.base-url=http://localhost:11434
quarkus.langchain4j.ollama.timeout=120s
#langchain4j-ollama-dev-service.ollama.host=localhost
#langchain4j-ollama-dev-service.ollama.port=11434
#langchain4j-ollama-dev-service.ollama.endpoint=http://${langchain4j-ollama-dev-service.ollama.host}:${langchain4j-ollama-dev-service.ollama.port}
quarkus.banner.path=banner.txt

# OIDC / Keycloak
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles

# Dev: local Keycloak (docker-compose.keycloak.yml)
%dev.quarkus.oidc.auth-server-url=http://localhost:8180/realms/sam
%dev.quarkus.oidc.client-id=sam-ui

# Keycloak Admin Client — used for user search in musician-user linking
# Dev: authenticate against master realm with admin-cli client
%dev.quarkus.keycloak.admin-client.server-url=http://localhost:8180
%dev.quarkus.keycloak.admin-client.realm=master
%dev.quarkus.keycloak.admin-client.client-id=admin-cli
%dev.quarkus.keycloak.admin-client.username=admin
%dev.quarkus.keycloak.admin-client.password=admin
%dev.quarkus.keycloak.admin-client.grant-type=PASSWORD
# Realm whose users are exposed via /api/admin/users
%test.sam.admin.keycloak.realm=sam
%dev.sam.admin.keycloak.realm=sam
# Prod: configure via environment variables
%prod.quarkus.keycloak.admin-client.server-url=${KEYCLOAK_ADMIN_URL}
%prod.quarkus.keycloak.admin-client.realm=master
%prod.quarkus.keycloak.admin-client.client-id=admin-cli
%prod.quarkus.keycloak.admin-client.username=${KEYCLOAK_ADMIN_USER}
%prod.quarkus.keycloak.admin-client.password=${KEYCLOAK_ADMIN_PASSWORD}
%prod.quarkus.keycloak.admin-client.grant-type=PASSWORD
%prod.sam.admin.keycloak.realm=${KEYCLOAK_REALM:sam}

# Test: disable OIDC so existing tests keep passing (use @TestSecurity for auth-specific tests)
%test.quarkus.oidc.enabled=false

# Prod: configure via environment variables
%prod.quarkus.oidc.auth-server-url=${OIDC_SERVER_URL}
%prod.quarkus.oidc.client-id=${OIDC_CLIENT_ID:sam-ui}

# Metrics for Prometheus scrape endpoint: GET /q/metrics
# Histogram buckets for classification/enrichment timers
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.export.prometheus.enabled=true

# SAM default configs
sam.coverage.base-score=0.7
sam.classification.agentic=true