quarkus.http.test-port=8081
# Disable OIDC so @TestSecurity can provide mock identities without a live Keycloak
quarkus.oidc.enabled=false
# Satisfy required config validation; AI classification is not exercised in unit tests
quarkus.langchain4j.openai.api-key=test-dummy
quarkus.rest-client.sheets-api.url=http://localhost:8081/
quarkus.rest-client.http2=true
quarkus.rest-client.capture-stacktrace=true
# Don't set quarkus.datasource.jdbc.url to trigger dev services!
quarkus.datasource.db-kind=postgresql
# Let Flyway manage the schema on the fresh DevServices container.
# Hibernate DDL generation is disabled, so Flyway migrations run unobstructed
# (V1.0.0 creates tables, V1.0.1 creates pg_trgm/fuzzystrmatch extensions, etc.).
quarkus.hibernate-orm.schema-management.strategy=none
%test.quarkus.hibernate-orm.database.generation=none
