quarkus.http.test-port=8081
quarkus.rest-client.sheets-api.url=http://localhost:8081/
quarkus.rest-client.http2=true
quarkus.rest-client.capture-stacktrace=true
# Don't set quarkus.datasource.jdbc.url to trigger dev services!
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Tests: Dev Services auto (keine URL!), drop-and-create für Clean-State
%test.quarkus.hibernate-orm.database.generation=drop-and-create
